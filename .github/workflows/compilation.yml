# Vérifie que l'app native compile vraiment, sur les deux plateformes.
# L'APK Android produit est téléchargeable directement (onglet Actions → un run
# → « Artifacts »), et installable sur un téléphone Android sans rien compiler.

name: Compilation de l'app native

on:
  push:
    paths: ['native/**', '.github/workflows/compilation.yml']
  pull_request:
    paths: ['native/**']
  workflow_dispatch:      # bouton « Run workflow » dans l'onglet Actions

jobs:
  analyse:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: native
      - run: flutter analyze
        working-directory: native
      - run: flutter test
        working-directory: native

  android:
    name: APK Android
    runs-on: ubuntu-latest
    needs: analyse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: native
      - run: flutter build apk --release
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: khoutba-android
          path: native/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: Compilation iOS
    runs-on: macos-latest
    needs: analyse
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: native
      # Sans signature : on vérifie que le code, les pods et Info.plist sont
      # corrects. L'installation sur iPhone demande un certificat personnel,
      # donc elle se fait depuis le Mac de l'utilisateur.
      - run: flutter build ios --release --no-codesign
        working-directory: native
